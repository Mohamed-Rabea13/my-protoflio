<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Video Player</title>
<link rel="stylesheet" href="project.css">
</head>
<body>

<div class="player">

<h2>🎬 Modern Video Player</h2>

<video id="video" width="100%">
    <source src="quraan.mp4" type="video/mp4">
</video>

<div class="buttons">
<button onclick="playVideo()">▶ Play</button>
<button onclick="pauseVideo()">⏸ Pause</button>
<button onclick="stopVideo()">⏹ Stop</button>
<button onclick="muteVideo()">🔇 Mute</button>
<button onclick="loopVideo()">🔁 Loop</button>
<button onclick="fullscreen()">⛶ Fullscreen</button>

<button onclick="speed(0.5)">0.5x</button>
<button onclick="speed(1)">1x</button>
<button onclick="speed(2)">2x</button>
</div>

<label>Volume</label>
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">

<label>Progress</label>
<input type="range" id="progress" value="0">

<div class="sizes">
<button onclick="resize('small')">Small</button>
<button onclick="resize('medium')">Medium</button>
<button onclick="resize('large')">Large</button>
</div>

<div class="time">
<span id="current">00:00</span>
<span id="duration">00:00</span>
</div>

</div>

<script src="project.js"></script>
</body>
</html>
